<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-dim" id="pageDim" hidden></div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-menu">
          <button class="eyebrow brand-menu-button" id="brandMenuButton" type="button" aria-expanded="false" aria-controls="brandToolbar">
            NOXXUS SYSTEM - By Kauã Reis
          </button>
          <nav class="brand-toolbar" id="brandToolbar" hidden>
            <a href="/">Conferência</a>
            <a href="/fichas-diarias.html">Fichas Diárias</a>
          </nav>
          <h1>To Do List</h1>
        </div>
        <button class="ghost reset-list-btn" id="resetTodoBtn" type="button">Limpar lista</button>
      </header>

      <section class="todo-workspace">
        <aside class="todo-left">
          <article class="panel">
            <h2>Lançamento</h2>
            <form class="todo-form" id="todoForm">
              <label>Nome da tarefa <input id="taskName" type="text" autocomplete="off" required /></label>
              <label>Prioridade
                <select id="taskPriority">
                  <option value="Alta">Alta</option>
                  <option value="Media">Média</option>
                  <option value="Baixa">Baixa</option>
                </select>
              </label>
              <label>Quantidade <input id="taskQuantity" type="number" min="1" step="1" value="1" required /></label>
              <button type="submit">Adicionar tarefa</button>
            </form>
          </article>

          <article class="panel progress-panel">
            <div class="panel-head">
              <h2>Conclusão total</h2>
              <span id="todoTotalLabel">0/0</span>
            </div>
            <div class="progress-chart" id="todoChart">
              <span id="todoPercent">0%</span>
            </div>
          </article>
        </aside>

        <section class="todo-right panel">
          <div class="panel-head">
            <h2>Lista</h2>
            <span id="todoListHint">0 tarefas</span>
          </div>
          <div class="todo-list" id="todoList"></div>

          <div class="completed-section">
            <div class="panel-head">
              <h2>Concluídos</h2>
              <span id="completedListHint">0 tarefas</span>
            </div>
            <div class="todo-list completed-list" id="completedList"></div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/todo.js"></script>
  </body>
</html>
